services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    # 호스트 노출은 로컬 디버깅용이며, 컨테이너 간 통신은 내부망(qdrant:6333)을 사용한다.
    # 기본값은 루프백(127.0.0.1) 바인딩이라 외부에 직접 노출되지 않는다.
    # AWS 등 다중 프로젝트 환경에서 포트가 겹치면 호스트 .env 에서 변수만 바꾼다.
    ports:
      - "${QDRANT_BIND:-127.0.0.1:6333}:6333"
      - "${QDRANT_GRPC_BIND:-127.0.0.1:6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: rag-api
    entrypoint: [ "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    # 운영에서는 nginx가 UI(Next.js)만 프록시하고, UI가 내부망(api:8000)으로
    # 백엔드를 호출하므로 API 의 호스트 노출은 필수가 아니다.
    # 로컬 디버깅/직접 호출 편의를 위해 루프백 바인딩으로만 노출한다.
    ports:
      - "${API_BIND:-127.0.0.1:8000}:8000"
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app/src
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - API_KEY=${API_KEY}
      # production 배포 시 주석 해제. API_KEY 미설정 상태로 기동되면
      # APIKeyMiddleware가 RuntimeError로 fail-fast 한다.
      # - APP_ENV=production
    restart: unless-stopped

  ui:
    build: ./ui
    container_name: rag-ui
    # 공개 진입점. nginx reverse proxy 가 이 호스트 포트로 프록시한다.
    # 다른 프로젝트와 3000 이 겹치면 호스트 .env 에서 UI_BIND 만 바꾼다.
    #   예) UI_BIND=127.0.0.1:3001  → nginx proxy_pass http://127.0.0.1:3001;
    ports:
      - "${UI_BIND:-127.0.0.1:3000}:3000"
    depends_on:
      - api
    volumes:
      - ./ui/prisma:/app/prisma
      - ./ui/.env:/app/.env
      - ./data:/app/data
    environment:
      - API_URL=http://api:8000
      - API_KEY=${API_KEY}
      - AUTH_TRUST_HOST=true
      # NextAuth 콜백/리다이렉트 URL 검증용 절대 URL.
      # 운영 도메인 사용 시 호스트 .env 의 AUTH_URL 로 재정의한다.
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
    restart: unless-stopped

volumes:
  qdrant_data:

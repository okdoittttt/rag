services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: rag-api
    entrypoint: [ "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app/src
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - API_KEY=${API_KEY}
      # production 배포 시 주석 해제. API_KEY 미설정 상태로 기동되면
      # APIKeyMiddleware가 RuntimeError로 fail-fast 한다.
      # - APP_ENV=production
    restart: unless-stopped

  ui:
    build: ./ui
    container_name: rag-ui
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./ui/prisma:/app/prisma
      - ./ui/.env:/app/.env
      - ./data:/app/data
    environment:
      - API_URL=http://api:8000
      - API_KEY=${API_KEY}
      - AUTH_TRUST_HOST=true
      # NextAuth 콜백/리다이렉트 URL 검증용 절대 URL.
      # 운영 도메인 사용 시 호스트 .env 의 AUTH_URL 로 재정의한다.
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
    restart: unless-stopped

volumes:
  qdrant_data:

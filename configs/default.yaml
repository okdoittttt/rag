# Terminal RAG 기본 설정
# 환경변수로 오버라이드 가능 (RAG_* prefix)

project:
  name: terminal-rag
  version: 0.1.0
  index_path: data/index

ingestion:
  supported_extensions:
    - ".txt"
    - ".md"
    - ".pdf"
  encoding: utf-8

chunking:
  chunk_size: 1500        # 자(characters)
  chunk_overlap: 200      # ~13%
  preserve_structure: true
  strategy: text          # text | markdown | semantic
  semantic_threshold: 0.7 # 의미론적 청킹 유사도 임계값 (0.0-1.0)

embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dimension: 384
  batch_size: 32
  store_type: qdrant         # qdrant | faiss
  qdrant:
    # host, port는 환경변수(QDRANT_HOST) 또는 기본값 사용
    collection: terminal-rag

retrieval:
  top_k: 5
  score_threshold: 0.4
  search_type: vector     # vector | hybrid
  # 문서 요약 모드(doc_mode + 요약 의도) 시 LLM 에 투입할 청크 상한.
  summary_max_chunks: 50
  # Cross-encoder reranker 기본 ON. CPU 환경에서 latency 부담이 크면 false 로 변경.
  use_reranker: true
  reranker_model: BAAI/bge-reranker-v2-m3
  # reranker_device: cuda    # GPU 환경에서 명시하면 추론이 5배 이상 빨라짐.
  # reranker_batch_size: 32

generation:
  model: gemini-2.5-flash
  # temperature: 0.1  # 코드에서 직접 제어하거나 필요 시 주석 해제하여 사용
  # max_tokens: 1024

logging:
  level: INFO
  format: json            # json | text
  file: logs/rag.log

[project]
name = "terminal-rag"
version = "0.1.0"
description = "Terminal-based RAG system for document Q&A with citation support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.115.0",
    "google-generativeai>=0.8.6",
    "kiwipiepy>=0.22.2",
    "numpy>=2.4.1",
    "pydantic>=2.12.5",
    "pypdf>=6.6.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.16.2",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "sentence-transformers>=5.2.0",
    "structlog>=25.5.0",
    "typer>=0.21.1",
    "uvicorn[standard]>=0.34.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # SWIG 기반 외부 라이브러리(faiss-cpu 등)에서 발생하는 경고. 우리 코드로 해결 불가.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    # google-generativeai 패키지 deprecation 경고. 향후 google-genai로 마이그레이션 예정.
    # 메시지가 줄바꿈/공백으로 시작하므로 (?s).* 로 선행 문자를 모두 흡수해야 매치된다.
    "ignore:(?s).*google\\.generativeai:FutureWarning",
]
